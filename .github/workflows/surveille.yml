name: Surveillance Bandai TCG+

on:
  # Déclencheur principal : cron-job.org appelle l'API GitHub toutes les 10 min (voir README).
  # Le cron de GitHub n'est pas fiable (seulement 4 lancements en 20 h sur ce dépôt).
  repository_dispatch:
    types: [verification]
  schedule:
    - cron: "17 * * * *"      # filet de sécurité si cron-job.org tombe en panne
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write             # pour sauvegarder etat_surveillance.json dans le dépôt

concurrency:
  group: surveille            # jamais deux vérifications en même temps

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Vérification
        # Lancement à la main (« Run workflow ») : envoie toujours une notif, pour tester
        run: python3 surveille.py --once ${{ github.event_name == 'workflow_dispatch' && '--signe-de-vie' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Sauvegarde de l'état
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat_surveillance.json
          git diff --cached --quiet && exit 0
          git commit -m "Etat de surveillance"
          # Si du code a été poussé entre-temps : on le récupère (en gardant l'état du bot) et on réessaie
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          done
          exit 1
